<!DOCTYPE html>
<html lang="en">
<head>

  <title>Our Menu | DineEase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="style.css">
</head>
<body class="inner-page">
  <header class="navbar">
    <a href="index.html" class="logo">Dine<span>Ease.</span></a>
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
    <nav class="nav-links" id="navLinks">
      <a href="index.html#home">Home</a><a href="index.html#about">About</a><a href="index.html#cuisines">Cuisines</a>
      <a href="menu.html?cuisine=indian" aria-current="page">Our Menu</a><a href="index.html#contact">Contact</a>

  <main>

      <p class="form-message toast" id="menuMessage" role="status" aria-live="polite"></p>
      <div class="menu-actions"><a href="index.html#cuisines" class="btn btn-outline">← Back to Cuisines</a><a href="cart.html" class="btn btn-primary">View Your Cart</a></div>
    </section>
  </main>
  <footer class="footer compact-footer"><div class="copyright"><p>© DineEase. A world of flavours. One destination.</p></div></footer>
